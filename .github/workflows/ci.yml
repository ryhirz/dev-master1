name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rz-home/backend

    services:
      # PostgreSQL 集成测试服务（SQLite 单测 + PG 迁移/集成两条链路）
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rz
          POSTGRES_PASSWORD: rzpwd
          POSTGRES_DB: rz_home
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rz -d rz_home"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Lint compile
        run: python -m compileall -q app

      - name: Test (SQLite 单测)
        run: pytest -q

      - name: Test (PG 迁移 + 种子 + 集成)
        # 两个变量都要给：alembic 与 app 读 DATABASE_URL，本测试单独读 PG_DATABASE_URL。
        # 只给后者会导致 alembic 回退到 SQLite（日志表现为 "Context impl SQLiteImpl"），
        # PG 库中无表，集成测试随即失败。
        env:
          DATABASE_URL: postgresql+psycopg2://rz:rzpwd@localhost:5432/rz_home
          PG_DATABASE_URL: postgresql+psycopg2://rz:rzpwd@localhost:5432/rz_home
        run: |
          # 生产路径：Alembic 迁移建库
          alembic upgrade head
          # 幂等种子
          python -c "from app.core.db import init_db, seed; init_db(); seed()"
          # 集成测试（校验连接 / 核心表 / 种子账号）
          pytest tests/test_m5_integration_pg.py -m integration -q

  frontend-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rz-home/frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run build

  frontend-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rz-home/frontend/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run build
