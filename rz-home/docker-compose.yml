# Rz家居 一键编排（Docker Compose：backend + pg + redis + web + admin）
# 启动：docker compose up --build
# 访问：前台 http://localhost:8080 ｜ 后台 http://localhost:8081 ｜ API 文档 http://localhost:8000/docs
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rz
      POSTGRES_PASSWORD: rzpwd
      POSTGRES_DB: rz_home
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rz -d rz_home"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      ENV: prod
      DATABASE_URL: postgresql+psycopg2://rz:rzpwd@db:5432/rz_home
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: http://localhost:8080,http://localhost:8081
      UPLOAD_DIR: /app/static/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/static/uploads
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: ./frontend/web
    ports:
      - "8080:80"
    depends_on:
      - backend

  admin:
    build: ./frontend/admin
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
