<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rz家居 · 后台管理系统（交互式原型）</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --cream:#FAF7F2; --ink:#1F1B16; --walnut:#6B4F3A; --walnut-d:#4A3728; --sand:#C8A97E; --muted:#574F45; --line:#E7E0D6;
  --success:#2F6B4F; --warning:#B5852A; --danger:#B4423A;
  --serif:"Noto Serif SC",serif; --sans:"Noto Sans SC",system-ui,sans-serif;
  --sidebar:#4A3728; --sidebar-2:#3a2a1f;
}
*{box-sizing:border-box;} html,body{margin:0;padding:0;}
body{font-family:var(--sans);color:var(--ink);background:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased;font-size:14px;}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;margin:0;color:var(--ink);}
a{color:inherit;text-decoration:none;} button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--walnut);outline-offset:2px;border-radius:4px;}
::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 18px;border-radius:8px;font-size:14px;font-weight:500;border:1px solid transparent;transition:.15s;white-space:nowrap;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--walnut);color:#fff;}
.btn-primary:hover:not(:disabled){background:var(--walnut-d);}
.btn-secondary{border-color:var(--line);background:#fff;color:var(--ink);}
.btn-secondary:hover:not(:disabled){background:var(--cream);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover:not(:disabled){filter:brightness(.94);}
.btn-sm{height:32px;padding:0 12px;font-size:13px;}
.btn-ghost{background:transparent;color:var(--walnut);padding:0 10px;height:34px;}
.btn-ghost:hover{background:rgba(107,79,58,.08);}

/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4A3728,#6B4F3A);padding:20px;}
.login-card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:400px;padding:36px 32px;}
.login-brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:6px;}
.login-mark{width:44px;height:44px;border-radius:10px;background:var(--walnut);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:22px;}
.login-title{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--walnut-d);}
.login-sub{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 22px;}
.login-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.login-field label{font-size:13px;font-weight:500;}
.login-field input{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font-size:15px;font-family:inherit;}
.login-field input:focus{outline:none;border-color:var(--walnut);box-shadow:0 0 0 3px rgba(107,79,58,.15);}
.login-field input.invalid{border-color:var(--danger);}
.role-pick{display:flex;gap:8px;margin-bottom:18px;}
.role-pick button{flex:1;height:38px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:13px;color:var(--muted);transition:.15s;}
.role-pick button.active{border-color:var(--walnut);background:rgba(107,79,58,.08);color:var(--walnut);font-weight:500;}
.login-err{color:var(--danger);font-size:13px;margin-bottom:12px;display:none;}
.login-err.show{display:block;}
.login-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;}

/* shell */
.shell{display:flex;min-height:100vh;}
.sidebar{width:232px;background:var(--sidebar);color:#EDE6DB;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.sidebar-head{display:flex;align-items:center;gap:10px;padding:18px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-head .login-mark{width:36px;height:36px;font-size:18px;}
.sidebar-head .t{font-family:var(--serif);font-weight:700;color:#fff;font-size:16px;}
.sidebar-nav{flex:1;overflow-y:auto;padding:10px 10px 20px;}
.nav-group{font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.4);padding:14px 12px 6px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:rgba(255,255,255,.78);font-size:14px;margin-bottom:2px;transition:.15s;cursor:pointer;border:none;background:none;width:100%;text-align:left;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--walnut);color:#fff;}
.nav-item svg{width:18px;height:18px;flex-shrink:0;}
.nav-sub{padding-left:14px;}
.sidebar-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:rgba(255,255,255,.55);}
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10;}
.breadcrumb{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;}
.breadcrumb .cur{color:var(--ink);font-weight:500;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.admin-badge{display:flex;align-items:center;gap:8px;}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--walnut);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;}
.role-tag{font-size:12px;padding:2px 8px;border-radius:9999px;background:rgba(107,79,58,.12);color:var(--walnut);}
.content{padding:24px;max-width:1440px;width:100%;}
@media(max-width:768px){.sidebar{display:none;} .content{padding:16px;} }

/* page head */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.page-head h2{font-size:24px;}
.page-head .sub{color:var(--muted);font-size:14px;margin-top:4px;}

/* card */
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(31,27,22,.04);}
.card-pad{padding:18px;}

/* filter bar */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px;}
.toolbar .field{display:flex;flex-direction:column;gap:5px;}
.toolbar .field label{font-size:12px;color:var(--muted);}
.toolbar select,.toolbar input{height:38px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:14px;font-family:inherit;background:#fff;min-width:140px;}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--walnut);box-shadow:0 0 0 3px rgba(107,79,58,.12);}
.toolbar .spacer{flex:1;}

/* table */
.table-wrap{overflow-x:auto;}
table.data{width:100%;border-collapse:collapse;font-size:14px;background:#fff;}
table.data th{text-align:left;padding:12px 14px;background:var(--cream);color:var(--muted);font-weight:500;font-size:13px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;}
table.data td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
table.data tbody tr:hover{background:#FBF8F3;}
table.data tbody tr:last-child td{border-bottom:none;}
.row-actions{display:flex;gap:6px;}
.mini-btn{height:30px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink);display:inline-flex;align-items:center;gap:4px;transition:.15s;}
.mini-btn:hover{background:var(--cream);}
.mini-btn.danger{color:var(--danger);border-color:rgba(180,66,58,.3);}
.mini-btn.danger:hover{background:rgba(180,66,58,.07);}

/* tags */
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:9999px;padding:2px 9px;font-size:12px;font-weight:500;}
.tag-neutral{background:var(--line);color:var(--muted);}
.tag-brand{background:rgba(107,79,58,.1);color:var(--walnut);}
.tag-new{background:rgba(181,133,42,.15);color:var(--warning);}
.tag-success{background:rgba(47,107,79,.12);color:var(--success);}
.tag-warning{background:rgba(181,133,42,.15);color:var(--warning);}
.tag-danger{background:rgba(180,66,58,.12);color:var(--danger);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}

/* pagination */
.pagination{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:16px;}
.page-btn{min-width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:13px;transition:.15s;}
.page-btn:hover:not(:disabled){background:var(--cream);}
.page-btn.active{background:var(--walnut);color:#fff;border-color:var(--walnut);}
.page-btn:disabled{opacity:.4;cursor:not-allowed;}

/* stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
@media(max-width:1024px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;}
.stat .n{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--walnut);}
.stat .l{color:var(--muted);font-size:13px;margin-top:4px;}
.stat .badge{font-size:11px;padding:2px 7px;border-radius:9999px;background:rgba(180,66,58,.12);color:var(--danger);margin-left:6px;}

/* charts (css) */
.bars{display:flex;align-items:flex-end;gap:10px;height:160px;padding:10px 0;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
.bar{width:100%;max-width:34px;background:linear-gradient(180deg,var(--walnut),var(--walnut-d));border-radius:6px 6px 0 0;transition:height .4s;}
.bar-label{font-size:11px;color:var(--muted);}

/* drawer (admin) */
.drawer-backdrop{position:fixed;inset:0;background:rgba(31,27,22,.4);z-index:1100;opacity:0;visibility:hidden;transition:opacity .25s;}
.drawer-backdrop.open{opacity:1;visibility:visible;}
.drawer{position:fixed;top:0;right:0;height:100%;width:480px;max-width:94vw;background:#fff;z-index:1101;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);box-shadow:-12px 0 40px rgba(31,27,22,.15);display:flex;flex-direction:column;}
.drawer.open{transform:translateX(0);}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);}
.drawer-head h3{font-size:18px;}
.drawer-body{flex:1;overflow-y:auto;padding:22px;}
.drawer-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}

/* form */
.form-row{margin-bottom:16px;display:flex;flex-direction:column;gap:6px;}
.form-row label{font-size:13px;font-weight:500;}
.form-row label .req{color:var(--danger);margin-left:2px;}
.form-row input,.form-row textarea,.form-row select{height:42px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:14px;font-family:inherit;background:#fff;width:100%;}
.form-row textarea{height:auto;padding:10px 12px;resize:vertical;min-height:90px;}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{outline:none;border-color:var(--walnut);box-shadow:0 0 0 3px rgba(107,79,58,.12);}
.form-row input.invalid,.form-row textarea.invalid,.form-row select.invalid{border-color:var(--danger);}
.err-msg{color:var(--danger);font-size:12px;display:none;}
.err-msg.show{display:block;}
.switch{display:inline-flex;align-items:center;gap:8px;}
.img-field{display:flex;align-items:center;gap:10px;}
.img-thumb{width:56px;height:56px;border-radius:8px;background:linear-gradient(135deg,#E9DFD2,#D8C7B2);display:flex;align-items:center;justify-content:center;color:var(--walnut-d);font-size:12px;overflow:hidden;}
.upload-btn{height:34px;padding:0 12px;border:1px dashed var(--line);border-radius:8px;background:#fff;color:var(--walnut);font-size:13px;}

/* sub tabs */
.subtabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);}
.subtab{padding:10px 16px;border:none;background:none;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;font-family:var(--serif);font-weight:600;}
.subtab.active{color:var(--walnut);border-bottom-color:var(--walnut);}

/* confirm modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(31,27,22,.4);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .2s;}
.modal-backdrop.open{opacity:1;visibility:visible;}
.modal{background:#fff;border-radius:14px;max-width:420px;width:100%;padding:24px;transform:translateY(12px);transition:transform .2s;box-shadow:0 20px 50px rgba(0,0,0,.18);}
.modal h3{font-size:18px;margin-bottom:8px;}
.modal p{color:var(--muted);font-size:14px;margin:0 0 20px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;}

/* toast */
.toast-wrap{position:fixed;top:20px;right:20px;z-index:1200;display:flex;flex-direction:column;gap:10px;}
.toast{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(31,27,22,.15);padding:12px 16px;font-size:14px;min-width:220px;border-left:4px solid var(--success);animation:toastIn .25s ease;}
.toast.error{border-left-color:var(--danger);}
.toast.warning{border-left-color:var(--warning);}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}

/* states */
.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty svg{width:54px;height:54px;color:var(--sand);margin-bottom:12px;}
.skeleton{background:linear-gradient(90deg,#EDE6DB 25%,#F5EFE6 50%,#EDE6DB 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:8px;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>

/* ============ SHARED CRUD ENGINE ============ */
function toolbarHtml(cfg){
  const st=cs(cfg.key);
  let f='';
  (cfg.filters||[]).forEach(fl=>{
    f+=`<div class="field"><label>${fl.label}</label><select data-filter="${fl.field}"><option value="">全部</option>${fl.options.map(o=>`<option value="${o.value}" ${st.filters[fl.field]===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`;
  });
  if(cfg.search){f+=`<div class="field" style="flex:1;min-width:180px;"><label>搜索</label><input data-search placeholder="${cfg.searchPlaceholder||'关键词'}"></div>`;}
  return `<div class="toolbar">${f}<div class="spacer"></div><button class="btn btn-primary" data-add>${I.plus} ${cfg.addLabel||'新增'}</button></div>`;
}
function tableHtml(cfg,rows){
  const cols=cfg.columns;
  const head='<tr>'+cols.map(c=>`<th>${esc(c.label)}</th>`).join('')+'<th style="width:120px;">操作</th></tr>';
  if(!rows.length){return `<div class="card"><div class="table-wrap"><table class="data"><thead>${head}</thead></table></div>${emptyState('暂无数据','点击右上角"'+cfg.addLabel+'”添加')}`;}
  const body=rows.map(r=>{
    const tds=cols.map(c=>`<td>${c.render(r)}</td>`).join('');
    const acts=`<td><div class="row-actions"><button class="mini-btn" data-edit="${r.id}">${I.edit} 编辑</button><button class="mini-btn danger" data-del="${r.id}">${I.trash} 删除</button></div></td>`;
    return `<tr>${tds}${acts}</tr>`;
  }).join('');
  return `<div class="card"><div class="table-wrap"><table class="data"><thead>${head}</thead><tbody>${body}</tbody></table></div></div>`;
}
function pagerHtml(cfg,total,page){
  if(total<=1)return '';
  let s='<div class="pagination">';
  s+=`<button class="page-btn" ${page===1?'disabled':''} data-pg="${page-1}">‹</button>`;
  for(let i=1;i<=total;i++)s+=`<button class="page-btn ${i===page?'active':''}" data-pg="${i}">${i}</button>`;
  s+=`<button class="page-btn" ${page===total?'disabled':''} data-pg="${page+1}">›</button></div>`;
  return s;
}
function emptyState(title,sub){return `<div class="empty">${I.empty}<p>${esc(title)}</p>${sub?`<button class="btn btn-secondary btn-sm" data-add>${esc(sub)}</button>`:''}</div>`;}

function runCRUD(cfg,targetSel){
  cfg._target=targetSel||'#content';
  const root=$(cfg._target);
  const st=cs(cfg.key);
  let rows=cfg.data();
  (cfg.filters||[]).forEach(fl=>{if(st.filters[fl.field])rows=rows.filter(r=>String(r[fl.field])===String(st.filters[fl.field]));});
  if(cfg.search&&st.search){const q=st.search.toLowerCase();rows=rows.filter(r=>cfg.searchFields.some(f=>String(r[f]).toLowerCase().includes(q)));}
  const size=cfg.pageSize||8;const total=Math.ceil(rows.length/size)||1;
  if(st.page>total)st.page=total;
  const pageRows=rows.slice((st.page-1)*size,st.page*size);
  let html=`<div class="page-head"><div><h2>${cfg.title}</h2><div class="sub">${cfg.subtitle||''}</div></div></div>`;
  html+=toolbarHtml(cfg);
  html+=tableHtml(cfg,pageRows);
  html+=pagerHtml(cfg,total,st.page);
  root.innerHTML=html;
  // bind
  root.querySelectorAll('[data-filter]').forEach(s=>s.addEventListener('change',e=>{st.filters[e.target.dataset.filter]=e.target.value;st.page=1;runCRUD(cfg);}));
  const si=root.querySelector('[data-search]'); if(si)si.addEventListener('input',e=>{st.search=e.target.value;st.page=1;runCRUD(cfg);});
  root.querySelectorAll('[data-pg]').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;st.page=parseInt(b.dataset.pg);runCRUD(cfg);}));
  root.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>openForm(cfg,null)));
  root.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>{const row=cfg.data().find(r=>r.id===b.dataset.edit);openForm(cfg,row);}));
  root.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    confirmDialog('确认删除该记录？删除后不可恢复。',()=>{cfg.onDelete(b.dataset.del);toast('已删除');runCRUD(cfg);});
  }));
}

/* form drawer */
function openForm(cfg,row){
  const isEdit=!!row;
  const fields=cfg.form.fields;
  const init=cfg.form.initial?cfg.form.initial(row):{};
  const body=fields.map(f=>{
    let ctrl;
    const val=init[f.name]!=null?init[f.name]:(f.default!=null?f.default:'');
    if(f.type==='textarea')ctrl=`<textarea name="${f.name}" placeholder="${f.placeholder||''}">${esc(val)}</textarea>`;
    else if(f.type==='select')ctrl=`<select name="${f.name}">${f.options.map(o=>`<option value="${o.value}" ${String(val)===String(o.value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
    else if(f.type==='switch')ctrl=`<label class="switch"><input type="checkbox" name="${f.name}" ${val?'checked':''}> ${val?'是':'否'}</label>`;
    else if(f.type==='image')ctrl=`<div class="img-field"><div class="img-thumb" data-thumb>${val?'<img src="'+esc(val)+'" style="width:100%;height:100%;object-fit:cover;">':f.label.slice(0,2)}</div><button type="button" class="upload-btn" data-upload>上传图片</button><input type="file" accept="image/*" style="display:none" data-file></div>`;
    else ctrl=`<input name="${f.name}" type="${f.type==='number'?'number':'text'}" value="${esc(val)}" placeholder="${f.placeholder||''}">`;
    return `<div class="form-row"><label>${esc(f.label)}${f.required?'<span class="req">*</span>':''}</label>${ctrl}<div class="err-msg" id="fe-${f.name}">请填写${esc(f.label)}</div></div>`;
  }).join('');
  openDrawer(cfg.form.title(row),body,()=>{
    const form=$('#drawerForm');
    form.addEventListener('submit',e=>{
      e.preventDefault();let ok=true;const vals={};
      fields.forEach(f=>{
        let v;
        if(f.type==='switch')v=form[f.name].checked;
        else if(f.type==='file'||f.type==='image')v=init[f.name]||'';
        else v=form[f.name].value.trim();
        vals[f.name]=v;
        if(f.required&&!String(v)){ok=false;$('#fe-'+f.name).classList.add('show');form[f.name].classList.add('invalid');}
        else{$('#fe-'+f.name).classList.remove('show');form[f.name].classList.remove('invalid');}
      });
      if(!ok){toast('请填写必填项','error');return;}
      const btn=$('#drawerSubmit');btn.disabled=true;btn.innerHTML='<span class="spinner"></span> 保存中';
      setTimeout(()=>{
        if(isEdit)cfg.onUpdate(row.id,vals);else cfg.onCreate(vals);
        closeDrawer();toast(isEdit?'已保存修改':'已新增');
        runCRUD(cfg);
      },500);
    });
    form.querySelectorAll('[data-upload]').forEach(u=>u.addEventListener('click',()=>u.nextElementSibling.click()));
    form.querySelectorAll('[data-file]').forEach(inp=>inp.addEventListener('change',e=>{
      if(e.target.files[0]){const t=form.querySelector('[data-thumb]');if(t)t.innerHTML='<span style="font-size:12px;color:var(--walnut)">已选</span>';toast('已选择图片（原型模拟上传）');}
    }));
    form.querySelectorAll('input[name][type=checkbox]').forEach(c=>c.addEventListener('change',()=>{const span=c.closest('.switch');if(span)span.lastChild.textContent=c.checked?' 是':' 否';}));
  });
}

/* drawer & confirm primitives */
function openDrawer(title,bodyHtml,onMount){
  const back=document.createElement('div');back.className='drawer-backdrop';
  back.innerHTML=`<div class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="drawer-head"><h3>${esc(title)}</h3><button class="icon-btn" id="drawerClose" aria-label="关闭" style="border:none;background:none;cursor:pointer;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <form class="drawer-body" id="drawerForm">${bodyHtml}
      <div class="drawer-foot" style="position:sticky;bottom:0;background:#fff;"><button type="button" class="btn btn-secondary" id="drawerCancel">取消</button><button type="submit" class="btn btn-primary" id="drawerSubmit">保存</button></div>
    </form></div>`;
  document.body.appendChild(back);
  requestAnimationFrame(()=>back.classList.add('open'));
  const close=()=>{back.classList.remove('open');setTimeout(()=>back.remove(),250);};
  back.addEventListener('click',e=>{if(e.target===back)close();});
  $('#drawerClose',back).addEventListener('click',close);
  $('#drawerCancel',back).addEventListener('click',close);
  if(onMount)onMount();
}
function closeDrawer(){$('.drawer-backdrop')&&$('.drawer-backdrop').classList.remove('open');setTimeout(()=>{$('.drawer-backdrop')&&$('.drawer-backdrop').remove();},250);}
function confirmDialog(msg,onYes){
  const back=document.createElement('div');back.className='modal-backdrop';
  back.innerHTML=`<div class="modal" role="alertdialog" aria-modal="true"><h3>确认操作</h3><p>${esc(msg)}</p><div class="modal-actions"><button class="btn btn-secondary" id="cno">取消</button><button class="btn btn-danger" id="cyes">确认删除</button></div></div>`;
  document.body.appendChild(back);
  requestAnimationFrame(()=>back.classList.add('open'));
  const close=()=>{back.classList.remove('open');setTimeout(()=>back.remove(),200);};
  $('#cno',back).addEventListener('click',close);
  $('#cyes',back).addEventListener('click',()=>{close();onYes();});
  back.addEventListener('click',e=>{if(e.target===back)close();});
}

/* ============ INTERACTION: MESSAGES ============ */
function viewMessages(){
  const st=cs('interaction/messages');
  let rows=DB.messages.slice();
  if(st.filters.type)rows=rows.filter(m=>m.type===st.filters.type);
  if(st.filters.status)rows=rows.filter(m=>m.status===st.filters.status);
  const contactNew=DB.messages.filter(m=>m.type==='contact'&&m.status==='new').length;
  const jobNew=DB.messages.filter(m=>m.type==='job_application'&&m.status==='new').length;
  const html=`<div class="page-head"><div><h2>留言管理</h2><div class="sub">联系留言 / 应聘留言 · 查看、回复、标记</div></div></div>
  <div class="toolbar">
    <div class="field"><label>类型</label><select data-filter="type"><option value="">全部</option><option value="contact" ${st.filters.type==='contact'?'selected':''}>联系留言</option><option value="job_application" ${st.filters.type==='job_application'?'selected':''}>应聘留言</option></select></div>
    <div class="field"><label>状态</label><select data-filter="status"><option value="">全部</option><option value="new" ${st.filters.status==='new'?'selected':''}>未处理</option><option value="handled" ${st.filters.status==='handled'?'selected':''}>已处理</option><option value="ignored" ${st.filters.status==='ignored'?'selected':''}>已忽略</option></select></div>
    <div class="spacer"></div>
    <div style="display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);">
      <span>联系未处理 ${statusTag('new')} ${contactNew}</span>
      <span>应聘未处理 ${statusTag('new')} ${jobNew}</span>
    </div>
  </div>
  <div class="card"><div class="table-wrap"><table class="data"><thead><tr><th>类型</th><th>姓名</th><th>电话</th><th>内容</th><th>关联职位</th><th>状态</th><th style="width:120px;">操作</th></tr></thead><tbody>
    ${rows.map(m=>`<tr><td>${m.type==='contact'?tag('联系','tag-brand'):tag('应聘','tag-new')}</td><td>${esc(m.name)}</td><td>${esc(m.phone)}</td><td style="max-width:260px;">${esc(m.content)}</td><td>${m.type==='job_application'?esc(jobTitle(m.ref_id)):'—'}</td><td>${statusTag(m.status)}</td><td><button class="mini-btn" data-view="${m.id}">${I.message} 详情</button></td></tr>`).join('')}
  </tbody></table></div></div>
  ${rows.length?'':emptyState('暂无留言','调整筛选条件')}`;
  $('#content').innerHTML=html;
  $('#content').querySelectorAll('[data-filter]').forEach(s=>s.addEventListener('change',e=>{st.filters[e.target.dataset.filter]=e.target.value;viewMessages();}));
  $('#content').querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>openMessageDrawer(b.dataset.view)));
}
function openMessageDrawer(id){
  const m=DB.messages.find(x=>x.id===id);if(!m)return;
  const body=`<div class="form-row"><label>类型</label><div>${m.type==='contact'?tag('联系留言','tag-brand'):tag('应聘留言','tag-new')}</div></div>
  <div class="form-row"><label>姓名</label><input value="${esc(m.name)}" disabled></div>
  <div class="form-row"><label>电话</label><input value="${esc(m.phone)}" disabled></div>
  ${m.type==='job_application'?`<div class="form-row"><label>关联职位</label><input value="${esc(jobTitle(m.ref_id))}" disabled></div>`:''}
  <div class="form-row"><label>内容</label><textarea disabled>${esc(m.content)}</textarea></div>
  <div class="form-row"><label>提交时间</label><input value="${esc(m.created_at)}" disabled></div>
  <div class="form-row"><label>状态</label><select id="mStatus"><option value="new" ${m.status==='new'?'selected':''}>未处理</option><option value="handled" ${m.status==='handled'?'selected':''}>已处理</option><option value="ignored" ${m.status==='ignored'?'selected':''}>已忽略</option></select></div>
  <div class="form-row"><label>回复内容</label><textarea id="mReply" placeholder="输入回复内容…">${esc(m.reply||'')}</textarea></div>
  <div class="drawer-foot" style="position:sticky;bottom:0;background:#fff;"><button type="button" class="btn btn-secondary" onclick="closeDrawer()">关闭</button><button type="button" class="btn btn-primary" id="mSave">保存</button></div>`;
  openDrawer('留言详情 · '+m.name,body,()=>{
    $('#mSave').addEventListener('click',()=>{m.status=$('#mStatus').value;m.reply=$('#mReply').value;if(m.reply)m.replied_at=new Date().toISOString().slice(0,16).replace('T',' ');closeDrawer();toast('已保存留言处理');viewMessages();});
  });
}

/* ============ SYSTEM: ROLES ============ */
function viewRoles(){
  const modules=[['series','产品系列'],['categories','产品分类'],['products','产品'],['cases','案例'],['news','新闻'],['about','关于我们配置'],['banners','轮播'],['jobs','招聘职位'],['messages','留言'],['admins','管理员'],['roles','角色权限'],['stats','数据统计']];
  const acts=[['r','查看'],['c','新增'],['u','编辑'],['d','删除']];
  const html=`<div class="page-head"><div><h2>角色与权限</h2><div class="sub">三角色预置，模块级增删改查权限（P1 可细化按钮级）</div></div></div>
  <div class="card card-pad">
    ${DB.roles.map(role=>{
      const perms=role.perms;
      return `<div style="margin-bottom:22px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <h3 style="font-size:17px;">${esc(role.name)}</h3>
          <button class="btn btn-secondary btn-sm" data-role="${role.id}">编辑权限</button>
        </div>
        <div style="overflow-x:auto;"><table class="data"><thead><tr><th>模块</th>${acts.map(a=>`<th>${a[1]}</th>`).join('')}</tr></thead><tbody>
          ${modules.map(m=>{const p=perms[m[0]]||[];return `<tr><td>${m[1]}</td>${acts.map(a=>`<td>${p.includes(a[0])?I.check:''}</td>`).join('')}</tr>`;}).join('')}
        </tbody></table></div>
      </div>`;
    }).join('')}
  </div>`;
  $('#content').innerHTML=html;
  $('#content').querySelectorAll('[data-role]').forEach(b=>b.addEventListener('click',()=>editRole(b.dataset.role)));
}
function editRole(id){
  const role=DB.roles.find(x=>x.id===id);const perms=role.perms;
  const modules=[['series','产品系列'],['categories','产品分类'],['products','产品'],['cases','案例'],['news','新闻'],['about','关于我们配置'],['banners','轮播'],['jobs','招聘职位'],['messages','留言'],['admins','管理员'],['roles','角色权限'],['stats','数据统计']];
  const acts=[['r','查看'],['c','新增'],['u','编辑'],['d','删除']];
  const body=`<p class="muted" style="font-size:13px;margin:0 0 14px;">勾选各模块的操作权限（原型演示，保存后即时反映到概览）。</p>
  <div class="card" style="border:none;"><div class="table-wrap"><table class="data"><thead><tr><th>模块</th>${acts.map(a=>`<th>${a[1]}</th>`).join('')}</tr></thead><tbody>
    ${modules.map(m=>`<tr><td>${m[1]}</td>${acts.map(a=>`<td><input type="checkbox" data-mod="${m[0]}" data-act="${a[0]}" ${perms[m[0]]&&perms[m[0]].includes(a[0])?'checked':''}></td>`).join('')}</tr>`).join('')}
  </tbody></table></div></div>
  <div class="drawer-foot" style="position:sticky;bottom:0;background:#fff;"><button class="btn btn-secondary" onclick="closeDrawer()">取消</button><button class="btn btn-primary" id="roleSave">保存</button></div>`;
  openDrawer('编辑权限 · '+role.name,body,()=>{
    $('#roleSave').addEventListener('click',()=>{
      const np={};
      modules.forEach(m=>{const actsArr=[];document.querySelectorAll(`input[data-mod="${m[0]}"]`).forEach(cb=>{if(cb.checked)actsArr.push(cb.dataset.act);});if(actsArr.length)np[m[0]]=actsArr;});
      role.perms=np;closeDrawer();toast('权限已更新');viewRoles();
    });
  });
}
function bindRoles(){}
