[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rz-home-backend"
version = "0.1.0"
description = "Rz家居 全栈项目后端 API（FastAPI）"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
